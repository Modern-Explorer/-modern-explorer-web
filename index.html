    <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO — overridden per-page by react-helmet-async -->
    <title>Modern Explorer | Guided Tours in Crestone, Colorado &amp; the San Luis Valley</title>
    <meta name="description" content="Immersive small-group guided tours in Crestone, Colorado. Explore UFO hotspots, Spanish treasure legends, paranormal history, and the mysteries of the San Luis Valley and Sangre de Cristo mountains." />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Modern Explorer" />
    <meta property="og:title"       content="Modern Explorer | Guided Tours in Crestone, Colorado &amp; the San Luis Valley" />
    <meta property="og:description" content="Immersive small-group guided tours in Crestone, Colorado. Explore UFO hotspots, Spanish treasure legends, paranormal history, and the mysteries of the San Luis Valley." />
    <meta property="og:image"       content="https://modernexplorer.me/assets/images/content/Logo/ME Logo Draft 5.png" />
    <meta property="og:url"         content="https://modernexplorer.me" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Modern Explorer | Guided Tours in Crestone, Colorado" />
    <meta name="twitter:description" content="Immersive small-group guided tours in the San Luis Valley, Colorado. UFO tours, paranormal history, Spanish treasure legends, and more." />

    <meta name="geo.region"    content="US-CO" />
    <meta name="geo.placename" content="Crestone, Colorado" />
    <meta name="geo.position"  content="37.9947;-105.5183" />
    <meta name="ICBM"          content="37.9947, -105.5183" />

    <!-- Preload the primary heading font only (12 KB, same origin).
         DM Sans body font is NOT preloaded — at 36 KB it competes with critical JS
         on throttled connections and delays first render more than the FOUT costs. -->
    <link rel="preload" href="/assets/fonts/oswald-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- NOTE: hero logo preload is in Home.tsx via Helmet (route-specific),
         not here — prevents loading 69 KB of home-only logo on every page. -->
  </head>
